<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Draft Coach</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0c12;
  --panel: #12162a;
  --panel-2: #171c34;
  --border: #232a4a;
  --accent: #f7c948;
  --accent2: #3bf0c4;
  --text: #e8eaf6;
  --muted: #6b76a8;
  --blue: #3d6bff;
  --red: #ef5350;
  --late: #c78bff;
  --ctr: #7fd6ff;
  --early: #4caf50;
  --maplock: #f7c948;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--bg);
  background-image:
    radial-gradient(700px 400px at 10% -10%, rgba(61,107,255,.12), transparent 60%),
    radial-gradient(700px 400px at 90% -10%, rgba(239,83,80,.10), transparent 60%);
  background-attachment: fixed;
  color: var(--text); font-family:'Rajdhani',sans-serif; min-height:100vh;
}
.page { max-width: 1320px; margin: 0 auto; padding: 20px 20px 60px; }

/* ---- banner ---- */
.banner {
  position: relative; height: 108px; border-radius: 12px; overflow: hidden;
  border: 1px solid var(--border); margin-bottom: 18px;
  background: linear-gradient(100deg, #1c3fc7 0%, #1c3fc7 46%, #0a0c12 50%, #b8232f 54%, #b8232f 100%);
}
.banner::after {
  content:""; position:absolute; inset:0;
  background-image: radial-gradient(rgba(255,255,255,.12) 1px, transparent 1px);
  background-size: 13px 13px; mix-blend-mode: overlay; pointer-events:none;
}
.banner-title {
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; z-index:2;
}
.banner-title .mark { font-size:30px; font-weight:700; font-style:italic; letter-spacing:3px; color:#fff; text-shadow:3px 3px 0 rgba(0,0,0,.5); }
.banner-title .sub { font-size:12px; letter-spacing:1.5px; color:rgba(255,255,255,.85); font-family:'Share Tech Mono',monospace; }
.banner-hint {
  position:absolute; bottom:10px; left:50%; transform:translateX(-50%); z-index:3;
  background:rgba(8,10,18,.82); border:1px solid rgba(255,255,255,.15);
  border-radius:8px; padding:5px 14px; font-size:12px; color:#fff;
}

/* ---- top controls ---- */
.controls-bar {
  display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end; margin-bottom:18px;
  background: linear-gradient(180deg, rgba(23,28,52,.6), rgba(255,255,255,.015));
  border:1px solid var(--border); border-radius:12px; padding:14px 16px;
}
.field { display:flex; flex-direction:column; gap:6px; }
.field label { font-size:10px; letter-spacing:1.5px; color:var(--muted); text-transform:uppercase; }
.field select {
  background:rgba(255,255,255,.05); border:1px solid var(--border); border-radius:8px;
  padding:8px 11px; color:var(--text); font-family:'Rajdhani',sans-serif; font-size:14px;
  outline:none; min-width:220px;
}
.field select:focus { border-color:var(--accent2); box-shadow:0 0 0 3px rgba(59,240,196,.18); }
.map-hint { font-size:11px; color:var(--muted); font-family:'Share Tech Mono',monospace; margin-top:2px; }
.fp-toggle { display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
.fp-btn { padding:9px 16px; background:transparent; border:none; color:var(--muted); cursor:pointer; font-weight:700; font-size:12px; letter-spacing:.5px; }
.fp-btn.active.us { background:var(--accent2); color:#000; }
.fp-btn.active.enemy { background:var(--red); color:#fff; }
.spacer { margin-left:auto; display:flex; gap:8px; }
.btn { padding:9px 16px; border-radius:8px; border:1px solid var(--border); background:rgba(255,255,255,.04); color:var(--text); font-family:'Rajdhani',sans-serif; font-weight:700; font-size:13px; letter-spacing:.5px; cursor:pointer; }
.btn:hover { border-color:var(--accent2); }
.btn:disabled { opacity:.35; cursor:not-allowed; }
.btn.danger:hover { border-color:var(--red); }
.db-grid{display:flex;align-items:stretch;gap:12px}
.db-team{flex:1;min-width:0;border-radius:14px;padding:12px}
.db-team.us{background:rgba(61,220,151,.06);border:1px solid rgba(61,220,151,.3)}
.db-team.enemy{background:rgba(255,77,77,.06);border:1px solid rgba(255,77,77,.3)}
.db-team-title{font-weight:800;font-size:12px;letter-spacing:1.5px;margin-bottom:10px;text-align:center}
.db-team.us .db-team-title{color:#3ddc97}
.db-team.enemy .db-team-title{color:#ff4d4d}
.db-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.db-vs{align-self:center;font-weight:900;font-size:18px;color:#6b7390;letter-spacing:2px}
.db-card{position:relative;border-radius:12px;padding:10px 6px 8px;text-align:center;background:rgba(255,255,255,.03);border:2px solid rgba(255,255,255,.08);transition:transform .15s}
.db-card.us.filled{border-color:#3ddc97}
.db-card.enemy.filled{border-color:#ff4d4d}
.db-card.current{border-color:#f7c948;animation:dbPulse 1.2s infinite}
@keyframes dbPulse{0%,100%{box-shadow:0 0 0 rgba(247,201,72,0)}50%{box-shadow:0 0 16px rgba(247,201,72,.55)}}
.db-pick{position:absolute;top:4px;left:6px;font-size:10px;font-weight:800;color:#8a93b2}
.db-card img,.db-q{width:84px;height:84px;margin:6px auto 6px;display:block}
.db-card img{border-radius:10px;object-fit:cover}
.db-q{display:flex;align-items:center;justify-content:center;font-size:30px;color:#4a516b;border-radius:10px;background:rgba(255,255,255,.03)}
.db-card.current .db-q{color:#f7c948}
.db-name{font-weight:800;font-size:12px;color:#e8ecff;letter-spacing:.5px}
.db-class{font-size:10px;color:#8a93b2;margin-top:2px;text-transform:uppercase}
.db-card.empty{opacity:.7}
#profilePanel{margin-bottom:12px;border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px;background:rgba(255,255,255,.03)}
.pm-slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.pm-slots label{display:flex;flex-direction:column;gap:3px;font-size:10px;font-weight:800;color:#f7c948;text-transform:uppercase;letter-spacing:.5px}
#profilePanel select,#profilePanel input{background:#10142a;color:#e8ecff;border:1px solid rgba(255,255,255,.15);border-radius:6px;padding:5px;font-size:12px;min-width:0}
.pm-btn{background:rgba(255,255,255,.06);color:#e8ecff;border:1px solid rgba(255,255,255,.15);border-radius:6px;padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer}
.pm-btn:hover{background:rgba(255,255,255,.12)}
.pm-btn.danger{color:#ff9a9a;border-color:rgba(255,77,77,.4)}
.pm-edit{margin-top:10px}
.pm-row{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.pm-row input{flex:1}
.pm-count{font-size:11px;color:#8a93b2;margin-right:auto}
.pm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px;max-height:260px;overflow-y:auto}
.pm-chip{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;border-radius:8px;border:2px solid rgba(255,77,77,.5);background:rgba(255,77,77,.06);cursor:pointer;opacity:.45;font-size:9px;font-weight:700;text-align:center;color:#e8ecff}
.pm-chip.on{border-color:#3ddc97;background:rgba(61,220,151,.08);opacity:1}
.pm-chip img{width:36px;height:36px;border-radius:6px;object-fit:cover}
/* ---- stage ---- */
.stage { display:grid; grid-template-columns: 1.15fr .85fr; gap:16px; margin-bottom:18px; }
@media (max-width: 880px) { .stage { grid-template-columns: 1fr; } }
.panel { background: linear-gradient(180deg, rgba(23,28,52,.55), rgba(255,255,255,.015)); border:1px solid var(--border); border-radius:12px; padding:16px; }
.panel-title { font-size:11px; letter-spacing:1.5px; color:var(--muted); text-transform:uppercase; margin-bottom:10px; }
.threat-box{background:rgba(255,60,60,.07);border:1px solid rgba(255,70,70,.35);border-radius:12px;padding:12px}
.threat-title{color:#ff4d4d;font-weight:800;font-size:15px;letter-spacing:.5px;text-transform:uppercase}
.threat-sub{color:#ff9a9a;font-size:11px;margin:2px 0 10px}
.threat-row{display:flex;align-items:center;gap:10px;padding:8px;margin-bottom:6px;border-radius:10px;background:rgba(255,60,60,.1);border-left:4px solid #ff3b3b;cursor:pointer;transition:background .15s,transform .15s}
.threat-row:hover{background:rgba(255,60,60,.2);transform:translateX(2px)}
.threat-rank{width:20px;text-align:center;font-weight:800;color:#ff3b3b}
.threat-row img{width:38px;height:38px;border-radius:8px;border:2px solid #ff3b3b;object-fit:cover}
.threat-info{flex:1;min-width:0}
.threat-name-line{display:flex;justify-content:space-between;align-items:baseline}
.threat-name{font-weight:700;color:#ffd6d6}
.threat-pct{font-size:12px;color:#ff8080;font-weight:700}
.threat-bar{height:4px;background:rgba(255,255,255,.08);border-radius:2px;margin:5px 0 3px;overflow:hidden}
.threat-bar-fill{height:100%;background:linear-gradient(90deg,#ff3b3b,#ff8a3d)}
.threat-reason{font-size:11px;color:#ff9a9a}
/* bans */
.ban-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
.ban-slot {
  width:56px; height:56px; border-radius:8px; border:2px dashed var(--border);
  display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden;
  background:rgba(239,83,80,.04);
}
.ban-slot.filled { border-style:solid; border-color:rgba(239,83,80,.4); }
.ban-slot img { width:100%; height:100%; object-fit:cover; filter:grayscale(1) brightness(.5); }
.ban-slot img + .x { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--red); font-size:20px; font-weight:700; }
.ban-slot-empty { color:var(--border); font-size:11px; }

/* draft board */
.turn-line { font-size:13px; font-family:'Share Tech Mono',monospace; color:var(--accent); margin-bottom:12px; }
.turn-line.enemy-turn { color:var(--red); }
.turn-line.done { color:var(--accent2); }
.board { display:flex; gap:8px; flex-wrap:wrap; }
.slot {
  width:84px; background:rgba(255,255,255,.03); border:2px solid var(--border); border-radius:10px;
  padding:8px 6px; text-align:center; position:relative; transition:box-shadow .2s, border-color .2s;
}
.slot.us { border-color:rgba(59,240,196,.3); }
.slot.enemy { border-color:rgba(239,83,80,.3); }
.slot.current { border-color:var(--accent); box-shadow:0 0 0 2px rgba(247,201,72,.3), 0 0 16px rgba(247,201,72,.2); }
.slot.filled.us { background:linear-gradient(180deg, rgba(59,240,196,.12), transparent); }
.slot.filled.enemy { background:linear-gradient(180deg, rgba(239,83,80,.12), transparent); }
.slot-side { font-size:8px; letter-spacing:1px; font-weight:700; margin-bottom:4px; }
.slot-side.us-c { color:var(--accent2); } .slot-side.enemy-c { color:var(--red); }
.slot img { width:44px; height:44px; object-fit:cover; border-radius:7px; margin:0 auto; display:block; }
.slot-name { font-size:9px; font-weight:700; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.slot-empty { color:var(--border); font-size:20px; padding:10px 0; }

/* watchlist */
.watchlist { margin-top:16px; background:rgba(239,83,80,.06); border:1px solid rgba(239,83,80,.28); border-radius:10px; padding:12px 14px; }
.watchlist-title { font-size:11px; font-weight:700; letter-spacing:1.5px; color:#ef9a9a; text-transform:uppercase; margin-bottom:9px; }
.watch-chip { display:flex; align-items:center; gap:9px; background:rgba(0,0,0,.22); border:1px solid rgba(239,83,80,.22); border-radius:8px; padding:6px 9px; margin-bottom:6px; }
.watch-chip:last-child { margin-bottom:0; }
.watch-chip img { width:32px; height:32px; border-radius:6px; object-fit:cover; flex-shrink:0; }
.watch-name { font-size:13px; font-weight:700; }
.watch-tag { font-size:9px; color:var(--red); font-family:'Share Tech Mono',monospace; margin-left:6px; }
.watch-reason { font-size:10px; color:var(--muted); font-family:'Share Tech Mono',monospace; }

/* suggestions (score list) */
.score-list { display:flex; flex-direction:column; gap:8px; max-height:520px; overflow-y:auto; padding-right:4px; }
.score-row { display:flex; align-items:center; gap:10px; border-left:3px solid var(--accent); border-radius:6px; padding-left:8px; }
.score-row img { width:48px; height:48px; border-radius:9px; object-fit:cover; border:1px solid var(--border); background:var(--panel); flex-shrink:0; }
.score-bar { position:relative; flex:1; min-height:46px; border-radius:9px; background:rgba(255,255,255,.04); border:1px solid var(--border); overflow:hidden; display:flex; flex-direction:column; justify-content:center; }
.score-bar-fill { position:absolute; left:0; top:0; bottom:0; background:linear-gradient(90deg, #ff8a3d, #f7c948); box-shadow:inset 0 -2px 0 rgba(0,0,0,.22); transition:width .3s ease; }
.score-bar-content { position:relative; z-index:1; padding:6px 12px; }
.score-name-line { display:flex; align-items:baseline; gap:8px; }
.score-name { font-size:14px; font-weight:700; color:#ffffff; }
.score-value { font-size:13px; font-weight:700; color:#ffffff; font-family:'Share Tech Mono',monospace; margin-left:auto; }
.score-detail { font-size:10px; color:rgba(255, 255, 255, 0.75); font-family:'Share Tech Mono',monospace; margin-top:1px; }
.score-row.gated { opacity:.55; }
.score-row.gated:hover { opacity:1; }
.tag { display:inline-block; padding:1px 6px; margin:2px 3px 0 0; border-radius:999px; font-size:8px; font-weight:700; letter-spacing:.6px; font-family:'Share Tech Mono',monospace; border:1px solid currentColor; }
.tag--late { color:var(--late); } .tag--counter { color:var(--ctr); } .tag--early { color:var(--early); } .tag--mapLocked { color:var(--maplock); }
.suggest-empty { color:var(--muted); font-size:13px; font-style:italic; padding:18px 0; text-align:center; }
.suggest-note { font-size:10px; color:var(--muted); font-family:'Share Tech Mono',monospace; margin-top:10px; }

.lanes{margin-top:12px;border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px;background:rgba(255,255,255,.03)}
.lanes-title{font-weight:800;font-size:14px;letter-spacing:.5px;color:#f7c948;text-transform:uppercase}
.lanes-sub{font-size:11px;color:#8a93b2;margin:2px 0 10px}
.lane{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px;margin-bottom:6px;border-radius:10px;border-left:4px solid #6b7390;background:rgba(255,255,255,.04)}
.lane.good{border-left-color:#3ddc97;background:rgba(61,220,151,.08)}
.lane.bad{border-left-color:#ff4d4d;background:rgba(255,77,77,.08)}
.lane-side{display:flex;align-items:center;gap:8px;flex:1;font-weight:800;font-size:13px;color:#e8ecff}
.lane-side.enemy{justify-content:flex-end;text-align:right}
.lane-side img{width:44px;height:44px;border-radius:8px;object-fit:cover}
.lane-side:not(.enemy) img{border:2px solid #3ddc97}
.lane-side.enemy img{border:2px solid #ff4d4d}
.lane-mid{text-align:center;min-width:52px}
.lane-wr{font-weight:900;font-size:18px;color:#e8ecff}
.lane.good .lane-wr{color:#3ddc97}
.lane.bad .lane-wr{color:#ff4d4d}
.lane-g{font-size:10px;color:#8a93b2}
.prof-toggle{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:#e8ecff;margin-bottom:8px;cursor:pointer}
.prof-toggle b{color:#f7c948;margin-left:auto}
.prof-better{font-size:11px;color:#f7c948;background:rgba(247,201,72,.08);border:1px solid rgba(247,201,72,.3);border-radius:8px;padding:6px 8px;margin-bottom:8px}
.not-owned{font-size:9px;font-weight:800;color:#ff9a9a;border:1px solid rgba(255,77,77,.4);border-radius:4px;padding:1px 4px;margin-left:6px}
.gap{color:#ff9a9a;font-size:11px}
/* search + grid */
.search-wrap { margin: 4px 0 14px; }
#brawlerSearch {
  width:100%; background:rgba(255,255,255,.05); border:1px solid var(--border); border-radius:10px;
  padding:13px 16px; color:var(--text); font-family:'Rajdhani',sans-serif; font-size:16px; outline:none;
}
#brawlerSearch:focus { border-color:var(--accent2); box-shadow:0 0 0 3px rgba(59,240,196,.16); }
#brawlerSearch::placeholder { color:var(--muted); }
.grid-hint { font-size:11px; color:var(--muted); margin:6px 2px 12px; font-family:'Share Tech Mono',monospace; }
.brawler-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:9px; }
.tile { position:relative; border-radius:10px; overflow:hidden; cursor:pointer; background:var(--panel); border:2px solid var(--border); transition:transform .1s, border-color .15s; user-select:none; }
.tile:hover { transform:translateY(-2px); border-color:var(--accent); }
.tile img { display:block; width:100%; aspect-ratio:1; object-fit:cover; }
.tile .tname { display:block; padding:5px 4px; text-align:center; font-size:11px; font-weight:700; background:rgba(0,0,0,.5); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tile.picked-us { border-color:var(--accent2); box-shadow:0 0 14px rgba(59,240,196,.28); }
.tile.picked-enemy { border-color:var(--red); box-shadow:0 0 14px rgba(239,83,80,.28); }
.tile.banned { filter:grayscale(1) brightness(.4); border-color:var(--red); cursor:not-allowed; }
.tile.banned::after { content:""; position:absolute; inset:0; background:linear-gradient(135deg, transparent 47%, var(--red) 47%, var(--red) 53%, transparent 53%); }
.tile.nodata::before { content:"no data"; position:absolute; top:3px; left:3px; background:rgba(0,0,0,.6); color:var(--muted); font-size:8px; padding:1px 5px; border-radius:4px; font-family:'Share Tech Mono',monospace; z-index:2; }

::-webkit-scrollbar { width:8px; height:8px; }
::-webkit-scrollbar-track { background:var(--bg); }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }

/* map search */
.map-combo { position:relative; min-width:220px; }
.map-combo input { width:100%; background:rgba(255,255,255,.05); border:1px solid var(--border); border-radius:8px; padding:8px 11px; color:var(--text); font-family:'Rajdhani',sans-serif; font-size:14px; outline:none; }
.map-combo input:focus { border-color:var(--accent2); box-shadow:0 0 0 3px rgba(59,240,196,.18); }
.map-list { display:none; position:absolute; top:100%; left:0; right:0; z-index:50; max-height:300px; overflow-y:auto; background:var(--panel-2); border:1px solid var(--border); border-radius:8px; margin-top:4px; }
.map-list.open { display:block; }
.map-gm { padding:8px 12px 4px; font-size:10px; letter-spacing:1.5px; text-transform:uppercase; font-weight:700; }
.map-item { padding:8px 12px; cursor:pointer; font-size:14px; }
.map-item:hover { background:rgba(59,240,196,.15); }

/* suggestion scrollbar */
.score-list, .map-list { scrollbar-width:thin; scrollbar-color:var(--accent) rgba(255,255,255,.06); }
.score-list::-webkit-scrollbar, .map-list::-webkit-scrollbar { width:10px; }
.score-list::-webkit-scrollbar-track, .map-list::-webkit-scrollbar-track { background:rgba(255,255,255,.06); border-radius:6px; }
.score-list::-webkit-scrollbar-thumb, .map-list::-webkit-scrollbar-thumb { background:var(--accent); border-radius:6px; border:2px solid var(--panel); }

/* predict */
.predict { margin-top:16px; background:rgba(59,240,196,.06); border:1px solid rgba(59,240,196,.28); border-radius:10px; padding:12px 14px; }
.predict-title { font-size:11px; font-weight:700; letter-spacing:1.5px; color:var(--accent2); text-transform:uppercase; margin-bottom:9px; }
.predict-bar { display:flex; height:28px; border-radius:8px; overflow:hidden; font-weight:700; font-size:13px; }
.predict-us { background:var(--accent2); color:#000; display:flex; align-items:center; padding:0 10px; }
.predict-enemy { background:var(--red); color:#fff; display:flex; align-items:center; justify-content:flex-end; padding:0 10px; }
.predict-notes { font-size:10px; color:var(--muted); font-family:'Share Tech Mono',monospace; margin-top:8px; }
</style>
</head>
<body>
<div class="page">

  <div class="banner">
    <div class="banner-title"><div class="mark">DRAFT COACH</div><div class="sub" id="bannerMap">SELECT A MAP TO BEGIN</div></div>
    <div class="banner-hint">Left click a brawler to draft it · Right click to ban it</div>
  </div>

  <div class="controls-bar">
    <div class="field">
      <label>Map</label>
      <div class="map-combo">
  <input id="mapSearch" type="text" placeholder="Search maps..." autocomplete="off"
    onfocus="openMapList()" oninput="filterMaps(this.value)" onkeydown="mapKey(event)">
  <div class="map-list" id="mapList"></div>
</div>
<div class="map-hint" id="mapHint"></div>
    </div>
    <div class="field">
      <label>First Pick</label>
      <div class="fp-toggle">
        <button class="fp-btn us" id="fpUs" onclick="setFirstPick('us')">US</button>
        <button class="fp-btn enemy" id="fpEnemy" onclick="setFirstPick('enemy')">ENEMY</button>

const getTags = name => BRAWLER_TAGS[String(name).toUpperCase()] || [];
function phaseName(pickIndex) { if (pickIndex <= 1) return 'early'; if (pickIndex <= 3) return 'mid'; return 'late'; }
function applyDraftTags(brawler, baseScore, { pickIndex = 0, mapStats = null } = {}) {
  const name = String(brawler).toUpperCase();
  const tags = getTags(name);
  const idx = Math.max(0, Math.min(pickIndex, TAG_CONFIG.draftLength - 1));
  const reasons = [];
  let mult = 1;
  for (const t of tags) {
    const curve = TAG_CURVES[t];
    if (!curve) continue;
    mult *= curve[idx];
    if (curve[idx] < 0.95) reasons.push(`${t}: too early (x${curve[idx].toFixed(2)})`);
    if (curve[idx] > 1.05) reasons.push(`${t}: good slot (x${curve[idx].toFixed(2)})`);
  }
  let excluded = false;
  const gateActive = mapStats && mapStats.games >= TAG_CONFIG.minSampleForGate &&
    !tags.some(t => GATE_IMMUNE_TAGS.includes(t)) &&
    (phaseName(idx) === 'early' || tags.some(t => ALWAYS_GATED_TAGS.includes(t)));
  if (gateActive) {
    const rate = mapStats.rates[name] || 0;
    if (rate < TAG_CONFIG.minMapPickRate) {
      reasons.push(`below ${(TAG_CONFIG.minMapPickRate*100).toFixed(0)}% map play rate (${(rate*100).toFixed(1)}%)`);
      if (TAG_CONFIG.gateMode === 'exclude') excluded = true; else mult *= TAG_CONFIG.gatePenalty;
    }
  }
  return { score: excluded ? -Infinity : baseScore * mult, multiplier: mult, excluded, tags, reasons };
}

function avgMu(b, targets, lookup) {
  const v = targets.map(e => lookup?.[b]?.[e]).filter(x => x && x.games >= 2).map(x => shrink(x.wr, x.games, SHRINK_PAIR));
  return v.length ? v.reduce((s,x) => s+x, 0) / v.length : null;
}
function counterTargets(opps, r) {
  let t = r.counter === 'first' ? opps.slice(0,1) : r.counter === 'last' ? opps.slice(-1) : r.counter === 'last2' ? opps.slice(-2) : opps;
  if (r.only)   t = t.filter(b => inClass(b, r.only));
  if (r.ignore) t = t.filter(b => !inClass(b, r.ignore));
  return t;
}
function planScore(b, ctx) {
  const out = { pts:0, reasons:[] };
  const plan = DRAFT_PLANS[ctx.gamemode];
  if (!plan) return out;
  const rules = [...(plan.slots[Math.min(ctx.pickIndex, 5)] || []), ...(plan.always || [])];
  const add = (p, label) => { out.pts += p; out.reasons.push(`${label} (${p>=0?'+':''}${p.toFixed(1)})`); };
  for (const r of rules) {
    if (r.when && !r.when(ctx)) continue;
    if (r.unless && inClass(b, r.unless)) continue;
    if (r.counter) {
      const t = counterTargets(ctx.opps, r), mu = avgMu(b, t, ctx.matchupLookup);
      if (mu !== null) add((mu-50) * (r.weight || 1), `${r.label || 'counters'} ${t.join('/')}`);
    } else if (r.resist) {
      const t = ALL_BRAWLERS.filter(x => x !== b && inClass(x, r.resist)), mu = avgMu(b, t, ctx.matchupLookup);
      if (mu !== null) add((mu-50) * (r.weight || 1), r.label);
    } else if (inClass(b, r)) add(r.pts, r.label);
  }
  return out;
}

function buildMapStats(map) {
  const per = {};
  let games = 0;
  for (const r of ALL_ROWS) {
    if (r.map !== map) continue;
    games++;
    for (const b of r.losers)  { const k=b.toUpperCase(); (per[k]=per[k]||{sets:0,wins:0}).sets++; }
    for (const b of r.winners) { const k=b.toUpperCase(); (per[k]=per[k]||{sets:0,wins:0}).sets++; per[k].wins++; }
  }
  const rates = {};
  for (const k in per) rates[k] = per[k].sets / (games || 1);
  return { games, per, rates };
}

// ========================================================
// MATCHUPS / SYNERGIES — scoped to the map's gamemode
// (individual maps are too sparse for reliable pair data)
// ========================================================
function computeMatchupData(gamemode) {
  const matchups = {}, combos = {};
  function addMatchup(x,y,winner) {
    const key = x<y?`${x}|${y}`:`${y}|${x}`;
    matchups[key] = matchups[key] || { a:x<y?x:y, b:x<y?y:x, aWins:0, bWins:0, total:0 };
    const m = matchups[key]; m.total++;
    if (winner===m.a) m.aWins++; else if (winner===m.b) m.bWins++;
  }
  function addCombo(x,y,won) {
    const key = x<y?`${x}|${y}`:`${y}|${x}`;
    combos[key] = combos[key] || { a:x<y?x:y, b:x<y?y:x, wins:0, total:0 };
    const c = combos[key]; c.total++; if (won) c.wins++;
  }
  for (const r of ALL_ROWS) {
    if (r.gamemode !== gamemode) continue;
    const L = r.losers.map(b=>b.toUpperCase()), W = r.winners.map(b=>b.toUpperCase());
    for (const l of L) for (const w of W) addMatchup(l,w,w);
    for (let i=0;i<L.length;i++) for (let j=i+1;j<L.length;j++) addCombo(L[i],L[j],false);
    for (let i=0;i<W.length;i++) for (let j=i+1;j<W.length;j++) addCombo(W[i],W[j],true);
  }
  return { matchups: Object.values(matchups), combos: Object.values(combos) };
}

const HARD_COUNTERS = [
/// 8-Bit:
//  ['MANDY', '8-BIT'], ['PIPER', '8-BIT'], ['BROCK', '8-BIT'], ['BYRON', '8-BIT'], ['ANGELO', '8-BIT'], ['PIERCE', '8-BIT'], ['BELLE', '8-BIT'], ['NANI', '8-BIT'],     

//  ['BULL', 'BIBI'],
];
const HARD_COUNTER_WR = 70, HARD_COUNTER_GAMES = 10;

function buildLookups(gamemode) {
  const { matchups, combos } = computeMatchupData(gamemode);
  const mm = {}, sy = {};
  for (const m of matchups) {
    (mm[m.a]=mm[m.a]||{})[m.b] = { wr: m.total? m.aWins/m.total*100:50, games:m.total };
    (mm[m.b]=mm[m.b]||{})[m.a] = { wr: m.total? m.bWins/m.total*100:50, games:m.total };
  }
  for (const c of combos) {
    const wr = c.total? c.wins/c.total*100:50;
    (sy[c.a]=sy[c.a]||{})[c.b] = { wr, games:c.total };
    (sy[c.b]=sy[c.b]||{})[c.a] = { wr, games:c.total };
  }
  for (const [w, l, wr = HARD_COUNTER_WR] of HARD_COUNTERS) {
    (mm[w] = mm[w] || {})[l] = { wr, games: HARD_COUNTER_GAMES };
    (mm[l] = mm[l] || {})[w] = { wr: 100 - wr, games: HARD_COUNTER_GAMES };
  }
  return { matchupLookup: mm, synergyLookup: sy };
}

let currentMap = null;

function getPickOrder() { return firstPick==='us' ? ['us','enemy','enemy','us','us','enemy'] : ['enemy','us','us','enemy','enemy','us']; }
function currentSide() { const o=getPickOrder(); return picks.length<6 ? o[picks.length] : null; }
function isPicked(name) { return picks.some(p=>p.brawler===name); }
function isBanned(name) { return bans.includes(name); }
function pickSide(name) { const p = picks.find(p=>p.brawler===name); return p ? p.side : null; }

function snapshot() { history.push(JSON.stringify({bans,picks})); if (history.length>50) history.shift(); }
function undo() { if (!history.length) return; const s=JSON.parse(history.pop()); bans=s.bans; picks=s.picks; render(); }
function resetDraft() { if (bans.length||picks.length) snapshot(); bans=[]; picks=[]; render(); }

function setMap(map) {
  currentMap = map || null;
  bans = []; picks = []; history = [];
  render();
}

  firstPick = fp;
  bans = []; picks = []; history = [];
  render();
}

function clickBrawler(name) {
  if (isBanned(name) || isPicked(name)) return;
  if (picks.length >= 6) return;
  snapshot();
  picks.push({ side: currentSide(), brawler: name });
  render();
}
function rightClickBrawler(name, ev) {

  else { if (bans.length>=6) { history.pop(); return; } bans.push(name); }

// ========================================================
function getCtx() {
  const gamemode = MAP_GAMEMODE[currentMap];
  const mapStats = buildMapStats(currentMap);
  const { matchupLookup, synergyLookup } = buildLookups(gamemode);
  const side = currentSide() || 'us';
  const allies = picks.filter(p=>p.side===side).map(p=>p.brawler);
  const opps = picks.filter(p=>p.side!==side).map(p=>p.brawler);
  return { gamemode, mapStats, matchupLookup, synergyLookup, pickIndex: picks.length, side, allies, opps };
}
function scoreCandidate(brawler, ctx) {
  const { mapStats, matchupLookup, synergyLookup, side, allies, opps } = ctx;
  const m = mapStats.per[brawler];
  if (!m || m.sets === 0) return null;
  const rawWr = m.wins / m.sets * 100;
  const baseWr = shrink(rawWr, m.sets, SHRINK_BASE);

  const synVals = allies.map(o => synergyLookup?.[brawler]?.[o]).filter(x=>x && x.games>=2).map(x=>shrink(x.wr,x.games,SHRINK_PAIR));
  const synAvg = synVals.length ? synVals.reduce((s,v)=>s+v,0)/synVals.length : null;
  const muAvg = avgMu(brawler, opps, matchupLookup);

  const picksLeft = getPickOrder().slice(picks.length).filter(s => s === side).length;

  // play-rate gate: <5% only allowed on the side's LAST pick and only if it counters
  if (mapStats.games >= MIN_SAMPLE_FOR_GATE) {
    const rate = mapStats.rates[brawler] || 0;
    if (rate < MIN_SUGGEST_PLAYRATE) {
      const counters = muAvg !== null && muAvg >= COUNTER_MU_WR;
      if (!(picksLeft === 1 && counters)) return null;
    }
  }

  const rawScore = baseWr*0.5 + (synAvg ?? 50)*0.3 + (muAvg ?? 50)*0.2;
  const plan = planScore(brawler, ctx);
  const prio = PRIORITY_PICKS[ctx.gamemode]?.[priorityGroup(ctx.pickIndex)]?.[brawler] ?? 1;
  if (prio !== 1) plan.reasons.push(`priority pick (x${prio.toFixed(2)})`);
  return { brawler, score: (rawScore + plan.pts) * prio, rawScore, baseWr, rawWr, sets: m.sets, synAvg, muAvg, reasons: plan.reasons };}


function computeWatchlist(ctx) {
  const { matchupLookup } = ctx;
  const ourPicks = picks.filter(p=>p.side==='us').map(p=>p.brawler);
  if (ourPicks.length < 2) return [];
  const enemyPicked = new Set(picks.filter(p=>p.side==='enemy').map(p=>p.brawler));
  const bannedSet = new Set(bans);
  const ourSet = new Set(ourPicks);
  const WEAK_WR = 35, MIN_GAMES = 3;
  const results = [];
  for (const cand of ALL_BRAWLERS) {
    if (bannedSet.has(cand) || ourSet.has(cand)) continue;
    const weakAgainst = [];
    for (const our of ourPicks) {
      const v = matchupLookup?.[our]?.[cand];
      if (v && v.games >= MIN_GAMES && v.wr <= WEAK_WR) weakAgainst.push({ brawler: our, wr: v.wr, games: v.games });
    }
    if (weakAgainst.length >= 2) results.push({ brawler: cand, weakAgainst, confirmed: enemyPicked.has(cand) });
  }
  results.sort((a,b) => (b.confirmed - a.confirmed) || (b.weakAgainst.length - a.weakAgainst.length));
  return results.slice(0, 6);
}

function teamRating(team, opp, ctx) {
  const { mapStats, matchupLookup, synergyLookup, gamemode } = ctx;
  const avg = a => a.length ? a.reduce((s,v)=>s+v,0)/a.length : 50;
  let total = 0, boost = 0; const notes = [];
  for (const b of team) {
    const m = mapStats.per[b];
    const base = m && m.sets ? shrink(m.wins/m.sets*100, m.sets, SHRINK_BASE) : 50;
    const syn = team.filter(o=>o!==b).map(o=>synergyLookup?.[b]?.[o]).filter(x=>x&&x.games>=2).map(x=>shrink(x.wr,x.games,SHRINK_PAIR));
    const mu = opp.map(e=>matchupLookup?.[b]?.[e]).filter(x=>x&&x.games>=2).map(x=>shrink(x.wr,x.games,SHRINK_PAIR));
    total += base*0.5 + avg(syn)*0.3 + avg(mu)*0.2;
   
  }
  let rating = (total + boost) / team.length;
  for (const req of (GM_REQUIREMENTS[gamemode] || [])) {
    if (team.filter(b => matchesReq(b, req)).length < req.need) { rating -= PREDICT_REQ_PENALTY; notes.push(`missing ${req.label} (-${PREDICT_REQ_PENALTY})`); }
  }
  return { rating, notes };
}

function bestLanes(U, E, lookup) {
  const mu = (a, b) => { const v = lookup?.[a]?.[b]; return v && v.games >= 2 ? { wr: shrink(v.wr, v.games, SHRINK_PAIR), games: v.games } : { wr: 50, games: v ? v.games : 0 }; };
  const need = Math.min(U.length, E.length);
  let best = null;
  (function rec(i, used, cur, sum) {
    if (cur.length + (U.length - i) < need) return;
    if (i === U.length) { if (cur.length === need && (!best || sum > best.sum)) best = { sum, pairs: cur.slice() }; return; }
    for (let j = 0; j < E.length; j++) {
      if (used.has(j)) continue;
      const m = mu(U[i], E[j]);
      used.add(j); cur.push({ us: U[i], en: E[j], wr: m.wr, games: m.games });
      rec(i + 1, used, cur, sum + m.wr);
      cur.pop(); used.delete(j);
    }
    rec(i + 1, used, cur, sum); // skip this one (only valid if teams are uneven)
  })(0, new Set(), [], 0);
  return best ? best.pairs : [];
}

          <div class="lane-mid"><div class="lane-wr">${l.wr.toFixed(0)}%</div><div class="lane-g">${l.games}g</div></div>
          <div class="lane-side enemy"><span>${l.en}</span><img src="${portraitSrc(l.en)}" onerror="this.style.display='none'"></div>
        </div>`; }).join('')}
    </div>`;
  }

  if (picks.length >= 6) {
    const a = teamRating(us, en, ctx), b = teamRating(en, us, ctx);
    const pUs = Math.round(100 / (1 + Math.exp(-(a.rating - b.rating)/PREDICT_SCALE)));
    const pEn = 100 - pUs;
    html += `<div class="predict">
      <div class="predict-title">Predicted Winner</div>
      <div class="predict-bar">
        <div class="predict-us" style="width:${pUs}%">US ${pUs}%</div>
        <div class="predict-enemy" style="width:${pEn}%">${pEn}% ENEMY</div>
      </div>
      <div class="predict-notes">${[...a.notes.map(n=>'US · '+n), ...b.notes.map(n=>'ENEMY · '+n)].join('<br>')}</div>
    </div>`;
  }
  wrap.innerHTML = html;
}

function render() {
  renderBanner();
  renderControls();
  renderBans();
  renderBoard();
  if (currentMap) {
    const ctx = getCtx();
    renderSuggestions(ctx);
    renderPrediction(ctx);
  } else {
    document.getElementById('predictWrap').innerHTML = '';
    renderSuggestions(null);
  }
  renderProfiles();
  renderGrid();
}

buildMapList();
render();
</script>
</body>
</html>
